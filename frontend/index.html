<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Everything between SEO:START/SEO:END is a per-page fallback, read
         by anything that fetches raw HTML without running the app's JS
         (WhatsApp/Facebook/Twitter link-preview crawlers, a non-JS
         Googlebot fallback fetch). The React app itself overrides all of
         this per-route/per-language once it hydrates (see
         src/components/Seo.jsx) -- but that only helps a real browser,
         not a dumb crawler, so scripts/generate-static-seo.mjs (run as
         part of `npm run build`) replaces this exact block with each
         route's own values in the built dist/<route>/index.html, keeping
         this file itself as just the homepage's copy (and the template
         the script clones for every other route). og-image.png is the
         SOS DZ logo lockup flattened onto white and padded to Facebook's
         recommended 1.91:1 ratio (source logo has a transparent
         background, which social crawlers render unpredictably). -->
    <!-- SEO:START -->
    <title>SOS DZ — Coordination de l'aide d'urgence en Algérie</title>
    <meta name="description" content="SOSDZ coordonne l'aide d'urgence en Algérie : signalez un besoin, proposez votre aide ou trouvez un point de collecte près de chez vous, partout au pays." />
    <meta name="keywords" content="aide urgence Algérie, catastrophe naturelle, incendie Kabylie, bénévolat Algérie, point de collecte, solidarité Algérie" />
    <link rel="canonical" href="https://sosdz.org/" />
    <link rel="alternate" hreflang="x-default" href="https://sosdz.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SOSDZ" />
    <meta property="og:title" content="SOS DZ — Coordination de l'aide d'urgence en Algérie" />
    <meta property="og:description" content="SOSDZ coordonne l'aide d'urgence en Algérie : signalez un besoin, proposez votre aide ou trouvez un point de collecte près de chez vous, partout au pays." />
    <meta property="og:url" content="https://sosdz.org/" />
    <meta property="og:image" content="https://sosdz.org/og-image.png" />
    <meta property="og:image:width" content="2172" />
    <meta property="og:image:height" content="1137" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter/X falls back to Open Graph tags for everything except
         card type, which has no OG equivalent. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SOS DZ — Coordination de l'aide d'urgence en Algérie" />
    <meta name="twitter:description" content="SOSDZ coordonne l'aide d'urgence en Algérie : signalez un besoin, proposez votre aide ou trouvez un point de collecte près de chez vous, partout au pays." />
    <meta name="twitter:image" content="https://sosdz.org/og-image.png" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"NGO","name":"SOSDZ","url":"https://sosdz.org","logo":"https://sosdz.org/logo-full.png","description":"SOSDZ coordonne l'aide d'urgence en Algérie : signalez un besoin, proposez votre aide ou trouvez un point de collecte près de chez vous, partout au pays."}</script>
    <!-- SEO:END -->

    <!-- The static SEO block above is a fallback for crawlers that never
         run JS. A JS-capable visitor (a real browser, or Googlebot, which
         does execute JS) instead gets per-route/per-language tags from
         src/components/Seo.jsx via react-helmet-async -- but Helmet only
         manages tags it creates itself, so without this it would just
         append its own title/meta/OG/Twitter tags alongside these static
         ones instead of replacing them, leaving two of everything (and
         since a document's *first* <title> is the one that wins, the
         static one would never even get overridden). This plain,
         synchronous (non-module) script runs before main.jsx's deferred
         module script, clearing the static block so Helmet starts from a
         clean head. Left completely alone by anything that doesn't run
         JS, which is exactly who the static block above is for. -->
    <script>
      var selectors = [
        'title',
        'meta[name="description"]',
        'meta[name="keywords"]',
        'link[rel="canonical"]',
        'link[rel="alternate"][hreflang="x-default"]',
        'meta[property^="og:"]',
        'meta[name^="twitter:"]',
        'script[type="application/ld+json"]',
      ]
      selectors.forEach(function (selector) {
        document.querySelectorAll(selector).forEach(function (el) { el.remove() })
      })
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H3JGTJFVQB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-H3JGTJFVQB');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
