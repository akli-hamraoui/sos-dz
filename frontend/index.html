<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg (a generic gradient placeholder, not the real SOS DZ
         mark) intentionally isn't linked here -- browsers that support SVG
         favicons prefer them over everything below, which would show the
         wrong icon in the tab even with the real ones present. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Google's favicon-in-search-results guidance recommends a
         directly-linked icon of at least 48x48px (a multiple of 48) --
         favicon.ico embeds a 48x48 layer too, but a real favicon-checker
         tool run against the live site flagged the 16/32px PNGs above as
         under that recommendation, so this is here explicitly rather
         than relying on Google picking the right size out of the .ico.
         Google's docs (developers.google.com/search/docs/appearance/
         favicon-in-search) go further still: 48x48 is only the floor,
         and they explicitly recommend a higher-resolution icon -- a
         multiple of 48 (96, 144...) -- for it to look good across
         surfaces, hence the two larger sizes below too. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Everything between SEO:START/SEO:END (including the homepage's
         own copy) is unconditionally regenerated at build time by
         scripts/generate-static-seo.mjs, from src/locales/fr.json --
         `npm run build` always overwrites what's here. It matters
         because this raw HTML (not the client-rendered result) is what
         anything that never runs the app's JS actually sees: WhatsApp/
         Facebook/Twitter link-preview crawlers, a non-JS Googlebot
         fallback fetch, or an AI crawler that doesn't execute JS at all.
         A real browser (or a JS-executing crawler like Googlebot) gets
         the same values, plus per-route/per-language ones, from
         src/components/Seo.jsx once React hydrates -- but that does
         nothing for the crawlers above, hence baking a copy in here too.
         What follows is only ever seen by someone running `vite build`
         directly without the postbuild script -- an edge case, but a
         real title/description is a safer fallback than a placeholder. -->
    <!-- SEO:START -->
    <title>SOS DZ — Coordination de l'aide d'urgence en Algérie</title>
    <meta name="description" content="SOSDZ coordonne l'aide d'urgence en Algérie : signalez un besoin, proposez votre aide ou trouvez un point de collecte près de chez vous, partout au pays." />
    <!-- SEO:END -->

    <!-- The static SEO block above is a fallback for crawlers that never
         run JS. A JS-capable visitor (a real browser, or Googlebot, which
         does execute JS) instead gets per-route/per-language tags from
         src/components/Seo.jsx via react-helmet-async -- but Helmet only
         manages tags it creates itself, so without this it would just
         append its own title/meta/OG/Twitter tags alongside these static
         ones instead of replacing them, leaving two of everything (and
         since a document's *first* <title> is the one that wins, the
         static one would never even get overridden). This plain,
         synchronous (non-module) script runs before main.jsx's deferred
         module script, clearing the static block so Helmet starts from a
         clean head. Left completely alone by anything that doesn't run
         JS, which is exactly who the static block above is for. -->
    <script>
      var selectors = [
        'title',
        'meta[name="description"]',
        'meta[name="keywords"]',
        'link[rel="canonical"]',
        'link[rel="alternate"][hreflang="x-default"]',
        'meta[property^="og:"]',
        'meta[name^="twitter:"]',
        'script[type="application/ld+json"]',
      ]
      selectors.forEach(function (selector) {
        document.querySelectorAll(selector).forEach(function (el) { el.remove() })
      })
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H3JGTJFVQB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-H3JGTJFVQB');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
